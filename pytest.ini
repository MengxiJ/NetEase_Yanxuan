[pytest]
markers =
    smoke: 冒烟测试
    regression: 回归测试（全量用例集，冒烟 ⊂ 回归）
    ui: UI界面测试
    workflow: 工作流驱动测试（统一入口）
    api: 接口测试（Mock 契约 + 抓包回放 + 性能/并发/安全）
    mock: Mock 服务契约测试
    har: Charles 抓包回放测试
    perf: 性能测试（延迟分位数 / 吞吐 / 持续负载 / 稳定性）
    concurrent: 并发测试（并发一致性 / 无丢失更新 / 故障稳定性）
    security: 安全测试（注入 / 越权 / 信息泄露 / 报文规范 / 安全头）
addopts = -s -v --alluredir report --clean-alluredir
testpaths = ./scripts ./api
python_files = test_*.py
python_classes = Test*
python_functions = test*
